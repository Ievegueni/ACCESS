<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transferências</title>
<link rel="stylesheet" href="/estilo.css">
</head>
<body>
<header>
  <h1 data-t="painel.titulo">Transferências</h1>
  <span class="quem" id="quem"></span>
  <span class="links">
    <a id="voltar" href="/admin" hidden data-t="link.clientes">&larr; Clientes</a>
    <a id="integracao" href="/programadores" data-t="link.integracao">Integração</a>
    <a href="/sair" data-t="link.sair">Sair</a>
  </span>
</header>

<section class="painelTopo" aria-label="Resumo">
  <div class="heroi">
    <span class="etiqueta" data-t="heroi.total">Transferido com sucesso</span>
    <b class="valor" id="heroiValor">&nbsp;</b>
    <span class="sub" id="heroiSub"></span>
  </div>
  <div class="estatisticas" id="estatisticas"></div>
</section>

<section class="carteiras" id="carteiras" aria-label="Carteiras" hidden></section>

<form class="barra" id="filtros">
  <label class="campo">
    <span data-t="filtro.estado">Estado</span>
    <select name="estado">
      <option value="" data-t="filtro.todos">Todos</option>
      <option value="sucesso" data-t="filtro.sucesso">Sucesso</option>
      <option value="falha" data-t="filtro.arever">A rever</option>
    </select>
  </label>
  <label class="campo"><span data-t="filtro.de">De</span><input type="date" name="de"></label>
  <label class="campo"><span data-t="filtro.ate">Até</span><input type="date" name="ate"></label>
  <button class="principal" data-t="filtro.filtrar">Filtrar</button>
  <button type="button" id="limpar" data-t="filtro.limpar">Limpar</button>
</form>

<div class="tabela">
  <table>
    <thead><tr>
      <th data-t="col.momento">Momento</th>
      <th class="num" data-t="col.valor">Valor</th>
      <th class="num" data-t="col.iban">IBAN ·····</th>
      <th data-t="col.estado">Estado</th>
      <th id="cabecalhoTelemovel" data-t="col.telemovel">Telemóvel</th>
      <th data-t="col.tid">TID</th>
      <th data-t="col.recebido">Recebido</th>
    </tr></thead>
    <tbody id="linhas"></tbody>
  </table>
  <p class="vazio" id="vazio" hidden data-t="painel.vazio">Sem transferências no período.</p>
</div>

<script src="/i18n.js"></script>
<script src="/painel.js"></script>
<script>
// Um cliente vê só o seu; o admin chega aqui com ?cliente=<id> a partir de /admin.
const clienteId = new URLSearchParams(location.search).get('cliente');
voltar.hidden = !clienteId;   // só quem veio da lista precisa do caminho de volta
if (clienteId) integracao.href = '/programadores?cliente=' + encodeURIComponent(clienteId);

montarSeletorIdioma(() => carregar());   // recarrega o que é construído em JS

async function carregar() {
  const params = new URLSearchParams([...new FormData(filtros)].filter(([, v]) => v));
  if (clienteId) params.set('cliente', clienteId);
  const r = await fetch('/api/transferencias?' + params);
  if (r.status === 401) return location.assign('/');   // sessão caiu
  const d = await r.json();

  quem.textContent = d.cliente;
  document.title = `${d.cliente} · ${t('painel.titulo', 'Transferências')}`;

  // Uma métrica manda, as outras acompanham: seis cartões iguais não dizem por
  // onde começar a olhar.
  heroiValor.innerHTML = montante(d.total.v);
  const plural = d.total.n === 1 ? t('sub.uma', 'transferência') : t('sub.varias', 'transferências');
  heroiSub.textContent = `${d.total.n} ${plural}`
    + (d.rever ? ` · ${d.rever} ${t('sub.arever', 'a rever')}` : '');

  const saude = cartaoSaude(d.saude, d.criado_em);
  // O saldo vem primeiro: é a pergunta de quem vai carregar as contas.
  const comSaldo = d.carteiras.filter(c => c.saldo != null);
  const total = comSaldo.reduce((s, c) => s + c.saldo, 0);
  estatisticas.innerHTML =
    (comSaldo.length ? estatistica(t('est.carteira', 'Saldo em carteira'), montante(total)) : '')
    + estatistica(t('est.24h', 'Últimas 24 h'), montante(d.dia.v))
    + estatistica(t('est.30d', 'Últimos 30 dias'), montante(d.mes.v))
    + estatistica(t('est.rever', 'A rever'), d.rever, d.rever ? 'alerta' : '')
    + estatistica(t('est.semReceber', 'Sem receber há'), saude.texto, saude.classe);

  carteiras.hidden = d.carteiras.length === 0;
  carteiras.innerHTML = d.carteiras.map(c => cartaoCarteira(c, d.criado_em)).join('');

  // A coluna do telemóvel só diz alguma coisa quando há mais do que um: com um
  // telemóvel só, repete o mesmo número em todas as linhas.
  const distintos = new Set(d.itens.map(t => t.numero_origem ?? '')).size;
  const mostrarTelemovel = distintos > 1 || d.itens.some(t => t.atribuido_por !== 'numero');
  cabecalhoTelemovel.hidden = !mostrarTelemovel;

  linhas.innerHTML = d.itens.map(item => `<tr>
      <td>${data(item.momento)}</td>
      <td class="num dinheiro">${montante(item.valor, item.valor_texto)}</td>
      <td class="num numero">${esc(item.iban_ultimos5 ?? '—')}</td>
      <td>${pillEstado(item.estado)}</td>
      ${mostrarTelemovel
        ? `<td class="numero">${esc(item.numero_origem ?? '—')}${marcaOrigem(item.atribuido_por)}</td>`
        : ''}
      <td class="tid">${esc(item.tid)}</td>
      <td class="quando">${data(item.recebido_em)}</td>
    </tr>`).join('');
  vazio.hidden = d.itens.length > 0;
}

/**
 * Um telemóvel: quanto lá resta, de quando é esse número, e se ainda dá sinal.
 *
 * O saldo vem do último SMS de confirmação daquele SIM, por isso é a fotografia
 * de um instante — o "de há X" ao lado não é enfeite, é o que evita carregar as
 * contas em cima de um número velho. Um carregamento feito por fora não aparece
 * aqui até à transferência seguinte.
 */
function cartaoCarteira(c, criadoEm) {
  // O criado_em do cliente evita pintar de vermelho um telemóvel acabado de
  // registar, que ainda não teve oportunidade de enviar nada.
  const saude = cartaoSaude(c, criadoEm);
  const semNada = c.silencio_ms == null;
  return `<div class="carteira ${saude.classe}">
      <span class="numero">${esc(c.bruto)}</span>
      <b class="valor">${c.saldo == null ? '—' : montante(c.saldo, c.saldo_texto)}</b>
      <span class="sub">${c.saldo_em
        ? `${t('cart.de', 'de há')} ${duracao(Date.now() - c.saldo_em)}`
        : t('cart.semSaldo', 'saldo ainda desconhecido')}</span>
      <span class="sub ${saude.classe}">${semNada
        ? t('cart.semSinal', 'nunca enviou nada')
        : `${t('cart.recebido', 'recebido há')} ${saude.texto}`}</span>
    </div>`;
}

const pillEstado = (estado) => estado === 'falha'
  ? `<span class="pill aviso"><i></i>${t('pill.arever', 'a rever')}</span>`
  : `<span class="pill"><i></i>${t('pill.sucesso', 'sucesso')}</span>`;

/**
 * Como se soube de quem era esta transferência. Só se marca o que não é o caso
 * normal: um telemóvel registado não precisa de explicação.
 */
function marcaOrigem(por) {
  if (por === 'numero') return '';
  if (por === 'manual') {
    return ` <span class="marca" title="${t('marca.mao.titulo', 'movida à mão pelo administrador')}">`
      + `${t('marca.mao', 'à mão')}</span>`;
  }
  return ` <span class="marca" title="${t('marca.token.titulo', 'telemóvel não registado — atribuída pelo token')}">`
    + `${t('marca.token', 'por token')}</span>`;
}

filtros.onsubmit = e => { e.preventDefault(); carregar(); };
limpar.onclick = () => { filtros.reset(); carregar(); };
carregar();
setInterval(carregar, 60000);
</script>
</body>
</html>
